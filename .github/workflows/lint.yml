name: CI

# 当前：所有 PR/main push 先用共用矩阵选择 job；普通文档只运行轻量计划。
# B0 合同构建并入本 workflow，避免与 dsh-b0.yml 各算一遍 changes。
# merge-gate 在 changes 失败或任一已选 job 失败/取消时失败；skip 不算失败。
# Sprint 41/83/85/87/123/129: e2e 分层、Node 24、ruff 自定义 step 等历史见 CHANGELOG
# 2026-07-25 PR5: permissions least-privilege、persist-credentials=false、
#   frontend/contract/FilterBuilder/audit jobs；lock/Docker/compose 变更触发

on:
  pull_request:
  push:
    branches: [main]

# 最小权限：默认只读 contents；禁止 GITHUB_TOKEN 写仓库
permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/check-plan.yml

  lint:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate single Agent rule source (read-only)
        run: bash scripts/sync-agents.sh --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt
      - name: "Install ruff (L4.41 + L4.9 lock version 1:1 with requirements-lock.txt)"
        run: pip install -r requirements-lock.txt
      - name: "Print python + ruff versions (Track A 2026-07-19)"
        run: |
          python --version
          ruff --version
      - name: "Run ruff check (Sprint 87 custom step, avoid ruff-action internal Node 20)"
        run: ruff check backend/

  ground-truth-lint:
    needs: changes
    if: needs.changes.outputs.ground_truth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Ground truth lint (B2 P1-3 + 二轮 B2 committed 模式)
        run: |
          python3 .githooks/check_review_ground_truth.py --committed --files \
            "docs/validation-reports/*.md" \
            "docs/飞书版架构文档/*.md"

  contract-filterbuilder-lint:
    needs: changes
    if: needs.changes.outputs.filterbuilder == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: FilterBuilder usage lint (L4.5)
        run: python3 backend/scripts/check_filter_builder_usage.py
      - name: Channel alias lint (L4.19)
        run: python3 backend/scripts/check_channel_alias.py

  test:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    env:
      FQ_CRM_ADMINS: admin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - name: B2 import completeness check
        run: python3 .githooks/check_imports.py
      - name: Run the same Python plan as local pre-push
        env:
          CHECK_PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          python3 -c "import json, os; print('\n'.join(json.loads(os.environ['CHECK_PLAN'])['files']))" > changed-files.txt
          python3 scripts/ci/run_checks.py --files-from changed-files.txt --only python
      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-check-evidence
          path: .context/checks/
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-vue3/package-lock.json
      - name: npm ci (official registry via .npmrc; no --legacy-peer-deps)
        run: npm ci
      - name: Run the same frontend plan as local pre-push
        working-directory: .
        env:
          CHECK_PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          python3 -c "import json, os; print('\n'.join(json.loads(os.environ['CHECK_PLAN'])['files']))" > changed-files.txt
          python3 scripts/ci/run_checks.py --files-from changed-files.txt --only frontend

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-vue3/package-lock.json
      - name: Install Python deps for pip-audit
        run: |
          pip install -r requirements-lock.txt
          pip install pip-audit==2.10.1
      - name: pip-audit (requirements-lock)
        run: pip-audit -r requirements-lock.txt --progress-spinner off
      - name: npm ci
        working-directory: frontend-vue3
        run: npm ci
      - name: npm audit production only
        working-directory: frontend-vue3
        run: npm audit --omit=dev --audit-level=high

  docker-smoke:
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    # 用 MB 级 seed DB 启动真实容器并探活；绝不复制生产 141GB DuckDB。
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          lfs: true
      - name: Backend Dockerfile build (no push)
        run: |
          docker build -t fuqing-crm-backend:ci -f Dockerfile .
      - name: Generate ephemeral test credentials (masked)
        # P0: 禁止 workflow 固定密码；每次 run 随机生成并 ::add-mask::
        run: |
          set -euo pipefail
          ADMIN_PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          FQSW_PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          TESTUSER_PASS=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          CREDS="admin:${ADMIN_PASS},fqsw:${FQSW_PASS},testuser:${TESTUSER_PASS}"
          echo "::add-mask::${ADMIN_PASS}"
          echo "::add-mask::${FQSW_PASS}"
          echo "::add-mask::${TESTUSER_PASS}"
          echo "::add-mask::${CREDS}"
          {
            echo "FQ_CRM_PASSWORDS=${CREDS}"
            echo "E2E_ADMIN_USER=admin"
            echo "E2E_ADMIN_PASSWORD=${ADMIN_PASS}"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
      - run: pip install -r requirements-lock.txt
      - name: Seed tiny DuckDB fixture
        run: |
          set -euo pipefail
          DB_DIR="${RUNNER_TEMP}/fuqing-docker-smoke"
          mkdir -p "$DB_DIR"
          python3 scripts/ci/seed_e2e_duckdb.py "$DB_DIR/fuqing_crm.duckdb"
          chmod 0777 "$DB_DIR"
          chmod 0666 "$DB_DIR/fuqing_crm.duckdb"
      - name: Frontend Dockerfile build (no push)
        run: |
          docker build -t fuqing-crm-frontend:ci -f frontend-vue3/Dockerfile frontend-vue3
      - name: Run backend and frontend container smoke
        run: |
          set -euo pipefail
          DB_DIR="${RUNNER_TEMP}/fuqing-docker-smoke"
          SMOKE_NETWORK="fuqing-crm-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f fuqing-crm-backend-ci fuqing-crm-frontend-ci >/dev/null 2>&1 || true
          docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true
          cleanup() {
            docker rm -f fuqing-crm-backend-ci fuqing-crm-frontend-ci >/dev/null 2>&1 || true
            docker network rm "$SMOKE_NETWORK" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$SMOKE_NETWORK"
          docker run --detach \
            --name fuqing-crm-backend-ci \
            --network "$SMOKE_NETWORK" \
            --network-alias backend \
            --publish 127.0.0.1:18001:8001 \
            --volume "$DB_DIR:/app/data/processed" \
            --env DUCKDB_PATH=/app/data/processed/fuqing_crm.duckdb \
            --env FQ_DB_MODE=schema_test \
            --env FQ_CRM_PASSWORDS \
            fuqing-crm-backend:ci
          BACKEND_READY=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18001/api/v1/health >/dev/null; then
              BACKEND_READY=true
              break
            fi
            sleep 1
          done
          if [ "$BACKEND_READY" != "true" ]; then
            docker logs fuqing-crm-backend-ci
            exit 1
          fi
          docker rm -f fuqing-crm-frontend-ci >/dev/null 2>&1 || true
          docker run --detach \
            --name fuqing-crm-frontend-ci \
            --network "$SMOKE_NETWORK" \
            --publish 127.0.0.1:18080:8080 \
            fuqing-crm-frontend:ci
          FRONTEND_READY=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
              FRONTEND_READY=true
              break
            fi
            sleep 1
          done
          if [ "$FRONTEND_READY" != "true" ]; then
            docker logs fuqing-crm-frontend-ci
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:18080/api/v1/health >/dev/null
          curl --fail --silent --head http://127.0.0.1:18080/ \
            | grep -i '^Content-Security-Policy:'

  b0-contract-build:
    needs: changes
    if: needs.changes.outputs.b0 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Each action's pinned action.yml declares node24. This is distinct from
      # the Node 24 runtime selected for our own build and verification below.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          clean: false
          lfs: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.14'
      - name: Create B0-only Python environment
        env:
          B0_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$B0_PYTHON" -m venv .context/dsh-b0/python-env
          .context/dsh-b0/python-env/bin/python -m pip install --disable-pip-version-check -r scripts/dsh-b0/requirements.lock
      - name: Prepare exact public DSH and private build tools
        run: node scripts/dsh-b0/pipeline.mjs --prepare --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python"
      - name: Same local and CI checks, including clean-directory rebuild
        run: node scripts/dsh-b0/pipeline.mjs --check --python "$GITHUB_WORKSPACE/.context/dsh-b0/python-env/bin/python"

  merge-gate:
    needs:
      - changes
      - lint
      - test
      - ground-truth-lint
      - contract-filterbuilder-lint
      - frontend
      - dependency-audit
      - docker-smoke
      - b0-contract-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Path plan must succeed
        if: needs.changes.result != 'success'
        run: |
          echo "changes result=${{ needs.changes.result }}"
          exit 1
      - name: Selected checks must not fail or cancel
        if: >-
          needs.lint.result == 'failure' || needs.lint.result == 'cancelled' ||
          needs.test.result == 'failure' || needs.test.result == 'cancelled' ||
          needs.ground-truth-lint.result == 'failure' || needs.ground-truth-lint.result == 'cancelled' ||
          needs.contract-filterbuilder-lint.result == 'failure' || needs.contract-filterbuilder-lint.result == 'cancelled' ||
          needs.frontend.result == 'failure' || needs.frontend.result == 'cancelled' ||
          needs.dependency-audit.result == 'failure' || needs.dependency-audit.result == 'cancelled' ||
          needs.docker-smoke.result == 'failure' || needs.docker-smoke.result == 'cancelled' ||
          needs.b0-contract-build.result == 'failure' || needs.b0-contract-build.result == 'cancelled'
        run: |
          echo "a selected check failed or was cancelled"
          exit 1
      - name: Gate passed
        run: echo "changes succeeded; selected jobs succeeded or skipped"
