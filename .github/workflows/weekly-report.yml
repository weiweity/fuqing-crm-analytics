name: Weekly Health Report

# B6 P3: 每周定时运行合成 not-slow pytest, 写 artifact + step summary, 趋势可见 (FOLLOWUPS.md §B6)
# 收益: 回归早 1 周发现, artifact 90 天保留可下载
# 验收: GitHub repo → Actions → Weekly Health Report → 任意一次 run → Artifacts → pytest-results 下载

on:
  schedule:
    # 每周一 UTC 1:00 = 北京时间 9:00 (周一上午对账, 跟 FOLLOWUPS.md §B6 描述一致)
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 允许手动触发 (测试 + 应急验证)

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 与 lint.yml / nightly 对齐；PR test 实测 ~28min，留足装依赖余量
    timeout-minutes: 45
    env:
      FQ_CRM_ADMINS: admin

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies (lock 锁版本, v0.4.7.7 B4)
        run: pip install -r requirements-lock.txt

      - name: B2 import completeness check (根因预防复检)
        run: python3 .githooks/check_imports.py

      - name: Run ruff
        # 与 lint.yml / nightly 一致：只扫 backend/，避免 scripts/_archive 假失败
        run: ruff check backend/

      - name: Run synthetic backend profile (shared bounded runner)
        run: python3 scripts/run_backend_tests_bounded.py --report-dir .context/checks/backend-ci

      - name: Upload pytest results artifact (90 天保留)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: .context/checks/backend-ci/
          retention-days: 90

      - name: Write actual suite totals
        if: always()
        run: python3 scripts/ci/summarize_checks.py .context/checks/backend-ci >> "$GITHUB_STEP_SUMMARY"
